AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Daily Deezer snapshot. EventBridge Scheduler invokes a Lambda that pulls genre charts and
  artist fan counts and writes dated JSON Lines files to the existing data bucket under raw/deezer/.

Parameters:
  DataBucket:
    Type: String
    Description: Existing S3 bucket that receives the raw snapshots.
  CodeKey:
    Type: String
    Description: S3 key of the Lambda deployment zip inside DataBucket.
  ScheduleCron:
    Type: String
    Default: cron(0 10 * * ? *)
    Description: Daily run time in UTC (10:00 UTC is 5-6 AM US Eastern).
  PerGenre:
    Type: Number
    Default: 25
    Description: Tracks pulled from each genre chart.

Resources:
  PullLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Explicit group so log retention is bounded and the function role can be scoped to it.
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-deezer-pull
      RetentionInDays: 30

  PullFunctionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Least-privilege execution role.
        must: Write access only to raw/deezer/ in the data bucket; no other S3 access.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: write-raw-deezer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${DataBucket}/raw/deezer/*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${PullLogGroup.Arn}:*

  PullFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Event Function on On-Demand capacity; the pull takes a few minutes and runs once a day.
        must: Timeout stays below the 900 second Lambda maximum. Same-day re-runs overwrite that day's partition.
    DependsOn: PullLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-deezer-pull
      Runtime: python3.13
      Handler: deezer_handler.lambda_handler
      Role: !GetAtt PullFunctionRole.Arn
      Code:
        S3Bucket: !Ref DataBucket
        S3Key: !Ref CodeKey
      Timeout: 900
      MemorySize: 256
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          PER_GENRE: !Ref PerGenre

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-pull-function
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PullFunction.Arn

  DailySchedule:
    Type: AWS::Scheduler::Schedule
    Metadata:
      com.aws.cloudformation.Context:
        why: Daily cadence, because Deezer fan counts and charts change slowly.
    Properties:
      Name: !Sub ${AWS::StackName}-daily
      ScheduleExpression: !Ref ScheduleCron
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt PullFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: "{}"
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

Outputs:
  FunctionName:
    Value: !Ref PullFunction
  LogGroupName:
    Value: !Ref PullLogGroup
