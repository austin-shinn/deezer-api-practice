AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Email alerts for the daily Deezer pull: one alarm for a failed run and one for a day with no run at all.

Parameters:
  FunctionName:
    Type: String
    Default: music-trends-deezer-deezer-pull
    Description: Name of the daily pull Lambda function.
  LastfmFunctionName:
    Type: String
    Default: music-trends-lastfm-lastfm-pull
    Description: Name of the daily Last.fm pull Lambda function.
  XrefFunctionName:
    Type: String
    Default: music-trends-xref-xref-refresh
    Description: Name of the weekly cross-reference refresh Lambda function.
  AlertEmail:
    Type: String
    Description: Address that receives alert emails. It must confirm the subscription once.

Resources:
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-pipeline-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Metadata:
      com.aws.cloudformation.Context:
        must: Publish is limited to CloudWatch alarms from this account, via aws:SourceAccount.
    Properties:
      Topics:
        - !Ref AlertTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  PullFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: A failed run leaves a gap in the history, so any error should notify.
    Properties:
      AlarmName: !Sub ${FunctionName}-errors
      AlarmDescription: The daily Deezer pull failed. Check the function's CloudWatch logs, then re-run for the missing date.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  PullMissingAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Catches a run that never happened, such as a disabled schedule or a paused project, which the error alarm cannot see.
        must: Period is 24 hours, matching the once-a-day schedule. Treat missing data as breaching.
    Properties:
      AlarmName: !Sub ${FunctionName}-no-run
      AlarmDescription: The daily Deezer pull did not run in the last 24 hours.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref FunctionName
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic

  LastfmFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${LastfmFunctionName}-errors
      AlarmDescription: The daily Last.fm pull failed. Check the function's CloudWatch logs, then re-run for the missing date.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LastfmFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  LastfmMissingAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        must: Period is 24 hours, matching the once-a-day schedule. Treat missing data as breaching.
    Properties:
      AlarmName: !Sub ${LastfmFunctionName}-no-run
      AlarmDescription: The daily Last.fm pull did not run in the last 24 hours.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref LastfmFunctionName
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic

  XrefFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: A failed refresh leaves new Deezer artists unmatched. There is no no-run alarm because alarm periods top out at 24 hours, too short for a weekly job.
    Properties:
      AlarmName: !Sub ${XrefFunctionName}-errors
      AlarmDescription: The weekly artist cross-reference refresh failed. Check the function's CloudWatch logs and re-run.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref XrefFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  TopicArn:
    Value: !Ref AlertTopic
