AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Weekly refresh of the Deezer-to-Last.fm artist cross-reference. EventBridge Scheduler invokes a Lambda
  that resolves Deezer artists with no match yet and rewrites reference/artist_xref/artist_xref.jsonl.

Parameters:
  DataBucket:
    Type: String
    Description: Existing S3 bucket that holds the raw snapshots and the reference file.
  CodeKey:
    Type: String
    Description: S3 key of the Lambda deployment zip inside DataBucket.
  ApiKeyParameterName:
    Type: String
    Default: /music-pipeline/lastfm-api-key
    Description: SSM SecureString parameter that holds the Last.fm API key.
  ScheduleCron:
    Type: String
    Default: cron(0 12 ? * SUN *)
    Description: Weekly run time in UTC. Sunday noon follows a full week of daily pulls.
  MaxNew:
    Type: Number
    Default: 600
    Description: Most new artists resolved in one run, which keeps a run inside the Lambda time limit.

Resources:
  RefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-xref-refresh
      RetentionInDays: 30

  RefreshFunctionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Least-privilege execution role for the cross-reference refresh.
        must: Read only the latest Deezer and Last.fm artist snapshots and the xref file; write only the xref file; read only the one API key parameter.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: xref-refresh-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${DataBucket}
                Condition:
                  StringLike:
                    s3:prefix:
                      - raw/deezer/artists/*
                      - raw/lastfm/artists/*
                      - reference/artist_xref/*
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/raw/deezer/artists/*
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/raw/lastfm/artists/*
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/reference/artist_xref/*
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${DataBucket}/reference/artist_xref/*
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiKeyParameterName}
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${RefreshLogGroup.Arn}:*

  RefreshFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Event Function on On-Demand capacity; a weekly run resolves only new artists, so it is short.
        must: Timeout stays below the 900 second Lambda maximum. MaxNew caps work per run.
    DependsOn: RefreshLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-xref-refresh
      Runtime: python3.13
      Handler: xref_handler.lambda_handler
      Role: !GetAtt RefreshFunctionRole.Arn
      Code:
        S3Bucket: !Ref DataBucket
        S3Key: !Ref CodeKey
      Timeout: 900
      MemorySize: 256
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          MAX_NEW: !Ref MaxNew

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-refresh-function
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RefreshFunction.Arn

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${AWS::StackName}-weekly
      ScheduleExpression: !Ref ScheduleCron
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt RefreshFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: "{}"
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

Outputs:
  FunctionName:
    Value: !Ref RefreshFunction
  LogGroupName:
    Value: !Ref RefreshLogGroup
